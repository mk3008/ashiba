version: "2"
plugins:
  - name: ts
    wasm:
      url: "https://downloads.sqlc.dev/plugin/sqlc-gen-typescript_0.1.3.wasm"
sql:
  - engine: "postgresql"
    schema: "sqlc/schema.sql"
    queries: "sqlc/queries.sql"
    codegen:
      - out: "src/generated"
        plugin: "ts"
        options:
          runtime: node
          driver: pg
