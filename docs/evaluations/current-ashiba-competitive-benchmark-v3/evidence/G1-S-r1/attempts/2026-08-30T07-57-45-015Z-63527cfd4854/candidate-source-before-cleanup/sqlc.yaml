version: "2"
plugins:
  - name: ts
    wasm:
      url: https://downloads.sqlc.dev/plugin/sqlc-gen-typescript_0.1.2.wasm
      sha256: f8b59cdd78b35fae157a95c5813cb09b1ebdd9a31acf2d7015465539986ccd2b
sql:
  - engine: "postgresql"
    # The generator script mounts a normalized, packet-owned schema here.
    # Keeping runner DDL outside the candidate source boundary is intentional.
    schema: "../../schema/schema.sql"
    queries: "sqlc/queries.sql"
    codegen:
      - out: "src/generated"
        plugin: ts
        options:
          runtime: node
          driver: pg
