version: "2"
plugins:
  - name: ts
    wasm:
      url: https://downloads.sqlc.dev/plugin/sqlc-gen-typescript_0.1.3.wasm
      sha256: 287df8f6cc06377d67ad5ba02c9e0f00c585509881434d15ea8bd9fc751a9368
sql:
  - engine: postgresql
    # The provenance command creates this expanded schema input temporarily,
    # runs sqlc, and removes it before the candidate is retained.
    schema: sqlc-schema-input.sql
    queries: src/queries/transfer.sql
    codegen:
      - out: src/generated/sqlc
        plugin: ts
        options:
          runtime: node
          driver: pg
