name: Release PR

on:
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  release_pr:
    runs-on: ubuntu-latest
    env:
      HUSKY: 0
      RELEASE_PR_TOKEN: ${{ secrets.CHANGESETS_TOKEN || secrets.GITHUB_TOKEN }}
      RELEASE_PR_TOKEN_SOURCE: ${{ secrets.CHANGESETS_TOKEN != '' && 'CHANGESETS_TOKEN' || 'GITHUB_TOKEN' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.19.0
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Report release PR token source
        shell: bash
        run: |
          if [ "${RELEASE_PR_TOKEN_SOURCE}" = "CHANGESETS_TOKEN" ]; then
            echo "Release PR will use CHANGESETS_TOKEN."
          else
            echo "Release PR will use GITHUB_TOKEN."
            echo "If required pull_request checks must run automatically on the release PR branch, configure CHANGESETS_TOKEN as a PAT."
          fi

      - name: Create or update release PR
        uses: changesets/action@v1
        with:
          version: pnpm changesets:version-lockfile
          commit: "chore(release): version packages"
          title: "chore(release): version packages"
          commitMode: git-cli
        env:
          GITHUB_TOKEN: ${{ env.RELEASE_PR_TOKEN }}
