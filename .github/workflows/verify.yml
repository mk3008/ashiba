name: Verify

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify:
    needs: [postgres-ticket-queue-reference]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false
      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          version: 10.19.0
      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Run verification gate
        run: pnpm verify

  npm-distribution:
    strategy:
      fail-fast: false
      matrix:
        include:
          - node: 22
            npm_major: 10
          - node: 24
            npm_major: 11
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false
      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          version: 10.19.0
      - name: Setup Node ${{ matrix.node }}
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - name: Install and build public packages
        run: |
          pnpm install --frozen-lockfile
          pnpm build
      - name: Verify npm packed distribution
        env:
          EXPECTED_NPM_MAJOR: ${{ matrix.npm_major }}
        run: pnpm verify:npm-distribution

  postgres-ticket-queue-reference:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: ticket_queue
          POSTGRES_USER: ticket_queue
          POSTGRES_PASSWORD: ticket_queue
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ticket_queue -d ticket_queue"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false
      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          version: 10.19.0
      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Verify live PostgreSQL reference
        env:
          DATABASE_URL: postgres://ticket_queue:ticket_queue@localhost:5432/ticket_queue
        run: pnpm --filter postgres-ticket-queue-reference verify
