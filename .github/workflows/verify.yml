name: Verify

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify:
    needs: [postgres-ticket-queue-reference, postgres-live]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          version: 10.19.0

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run verification gate
        run: pnpm verify

  support-inbox-example:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          version: 10.19.0

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build workspace packages used by the example
        run: pnpm build

      - name: Prepare example environment
        run: cp examples/hono-pg-support-inbox/.env.example examples/hono-pg-support-inbox/.env

      - name: Start example PostgreSQL
        working-directory: examples/hono-pg-support-inbox
        run: docker compose up -d

      - name: Verify support inbox example
        run: |
          pnpm --dir examples/hono-pg-support-inbox db:wait
          pnpm --dir examples/hono-pg-support-inbox db:seed
          pnpm --dir examples/hono-pg-support-inbox verify

      - name: Stop example PostgreSQL
        if: always()
        working-directory: examples/hono-pg-support-inbox
        run: docker compose down --volumes

  postgres-ticket-queue-reference:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: ticket_queue
          POSTGRES_USER: ticket_queue
          POSTGRES_PASSWORD: ticket_queue
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ticket_queue -d ticket_queue"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          version: 10.19.0

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify live PostgreSQL reference
        env:
          DATABASE_URL: postgres://ticket_queue:ticket_queue@localhost:5432/ticket_queue
        run: pnpm --filter postgres-ticket-queue-reference verify

  postgres-live:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: ashiba_live
          POSTGRES_USER: ashiba_live
          POSTGRES_PASSWORD: ashiba_live
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ashiba_live -d ashiba_live"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          version: 10.19.0

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build workspace packages used by live contracts
        run: pnpm build

      - name: Verify PostgreSQL live contracts
        env:
          ASHIBA_TEST_DATABASE_URL: postgres://ashiba_live:ashiba_live@localhost:5432/ashiba_live
          ASHIBA_POSTGRES_DATABASE_URL: postgres://ashiba_live:ashiba_live@localhost:5432/ashiba_live
        run: pnpm verify:postgres-live

  support-inbox-example-autocrlf:
    runs-on: windows-latest
    steps:
      - name: Configure Windows checkout line endings
        run: git config --global core.autocrlf true

      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          version: 10.19.0

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build workspace packages used by drift check
        run: pnpm build

      - name: Verify clean Windows checkout drift
        run: pnpm --dir examples/hono-pg-support-inbox check:drift

      - name: Verify CRLF-only SQL drift tolerance
        shell: pwsh
        run: |
          $files = @(
            'examples/hono-pg-support-inbox/src/features/support-inbox/list-tickets/queries/list-tickets/list-tickets.sql',
            'examples/hono-pg-support-inbox/src/features/support-inbox/list-tickets/queries/get-ticket-detail/get-ticket-detail.sql'
          )
          foreach ($file in $files) {
            $path = Resolve-Path $file
            $text = [System.IO.File]::ReadAllText($path)
            $lf = $text -replace "`r`n", "`n"
            $crlf = $lf -replace "`n", "`r`n"
            [System.IO.File]::WriteAllText($path, $crlf, [System.Text.UTF8Encoding]::new($false))
          }
          git ls-files --eol -- $files
          pnpm --dir examples/hono-pg-support-inbox check:drift
